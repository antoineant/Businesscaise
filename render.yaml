services:
  # PostgreSQL Database
  - type: pserv
    name: businesscase-db
    env: docker
    plan: standard
    region: oregon
    databaseName: businesscase
    databaseUser: businesscase_user
    ipAllowList: []

  # Backend API Service
  - type: web
    name: businesscase-api
    runtime: node
    plan: standard
    region: oregon
    buildCommand: cd backend && npm install && npm run build && npm run migrate:up
    startCommand: cd backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: businesscase-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: businesscase-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: businesscase-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: businesscase-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: businesscase-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: businesscase-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: CORS_ORIGIN
        sync: false  # Set manually to include frontend URLs
      - key: PERPLEXITY_API_KEY
        sync: false  # Optional - set manually if using AI features
      - key: PERPLEXITY_RATE_LIMIT
        value: 5
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

  # Main Frontend - Student Player Interface
  - type: web
    name: businesscase-frontend
    runtime: static
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false  # Will be set to backend URL
      - key: VITE_SOCKET_URL
        sync: false  # Will be set to backend URL
      - key: VITE_ENV
        value: production
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

  # GM Dashboard - Instructor Interface
  - type: web
    name: businesscase-gm-dashboard
    runtime: static
    plan: starter
    region: oregon
    buildCommand: cd gm-dashboard && npm install && npm run build
    staticPublishPath: ./gm-dashboard/dist
    envVars:
      - key: VITE_API_URL
        sync: false  # Will be set to backend URL
      - key: VITE_SOCKET_URL
        sync: false  # Will be set to backend URL
      - key: VITE_ENV
        value: production
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
